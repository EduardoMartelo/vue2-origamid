<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <script src="./vue.js"></script>
  <title>Vue.js</title>
</head>
<body>
  <div id="app">
    <p>Estoque Produto {{estoqueProduto}}</p>
    <button v-show="carrinho" @click="removerItem">-</button>
    <button v-show="estoqueProduto" @click="adicionarItem">+</button>
    {{carrinho}}
    <p v-if="estoqueProduto === 0">Estoque esgotado</p>
  </div>
  
  <script>

    const vm = new Vue ({
      el: "#app",
      data: {
       estoqueProduto: 7,
       carrinho: 0
      },
      methods: {
        adicionarItem() {
          this.carrinho++
          this.estoqueProduto--
        },
        removerItem() {
          this.carrinho--
          this.estoqueProduto++
        }
      }
    })

  </script>
</body>
</html>

<!--
  Simule a adição de um produto no carrinho
  este produto possui estoque de 7 itens
  (utilize a mesma ideia do contador).

  Ao atingir 7 itens mostre uma mensagem informando
  não ser possível adicinar mais do que 7 itens.

  Remova também o botão de adicionar itens.
-->
